# Publishes the site to GitHub Pages on every push to main. Every Monday it first refreshes the
# observation map, statistics, world rank and gallery (only new MPECs are fetched; data/mpec_index.json
# remembers the ones already checked), commits the new data and then publishes.
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Update data and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read  # least privilege; each job below asks only for what it needs

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04  # pinned: Python 3.12 is ready-built here (ubuntu-latest is moving to 26.04)
    timeout-minutes: 120
    permissions:
      contents: write  # to commit the refreshed data
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # the download scripts below never get a token

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: New MPECs and orbits
        run: python tools/build_observations.py --workers 2

      - name: World rank
        run: python tools/observer_rank.py --name L.Poropat --station L01
        continue-on-error: true  # keeps last week's rank if MPEC Watch can't be read

      - name: AstroBin gallery
        run: |
          pip install --quiet pillow
          python tools/fetch_astrobin.py --user-id 93381
        continue-on-error: true

      - name: Commit changes
        env:
          TOKEN: ${{ github.token }}  # only this step can push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/images/gallery
          git diff --cached --quiet && exit 0
          git commit -m "Update observation data"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" "$GITHUB_REF_NAME"
          git push "$remote" "HEAD:$GITHUB_REF_NAME"

  deploy:
    needs: update
    if: ${{ !cancelled() && !failure() }}  # also runs when "update" was skipped (pushes)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # branch tip, including this run's data commit
          persist-credentials: false

      - name: Collect the site files
        run: rsync -a --exclude .git --exclude .github --exclude .claude --exclude tools/.cache ./ "$RUNNER_TEMP/site/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
