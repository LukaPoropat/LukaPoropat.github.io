# Publishes the site to GitHub Pages on every push to main. Every day it first looks for new MPECs
# (observation map and statistics; only new MPECs are fetched, data/mpec_index.json remembers the ones
# already checked), on Mondays it also refreshes the world rank and the gallery; when anything changed
# it commits the new data and publishes.
# Needs Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Update data and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"      # Mondays: new MPECs, world rank and gallery
    - cron: "17 5 * * 0,2-6"  # other days: new MPECs only
  workflow_dispatch:

permissions:
  contents: read  # least privilege; each job below asks only for what it needs

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04  # pinned: Python 3.12 is ready-built here (ubuntu-latest is moving to 26.04)
    timeout-minutes: 120
    permissions:
      contents: write  # to commit the refreshed data
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # the download scripts below never get a token

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: New MPECs and orbits
        run: python tools/build_observations.py --workers 2

      - name: World rank
        if: github.event.schedule != '17 5 * * 0,2-6'  # weekly: it reads ~400 MPEC Watch pages
        run: python tools/observer_rank.py --name L.Poropat --station L01
        continue-on-error: true  # keeps last week's rank if MPEC Watch can't be read

      - name: AstroBin gallery
        if: github.event.schedule != '17 5 * * 0,2-6'
        run: |
          pip install --quiet pillow
          python tools/fetch_astrobin.py --user-id 93381
        continue-on-error: true

      - name: Commit changes
        id: commit
        env:
          TOKEN: ${{ github.token }}  # only this step can push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/images/gallery
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Update observation data"
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" "$GITHUB_REF_NAME"
          git push "$remote" "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    # also runs when "update" was skipped (pushes); a scheduled run that found nothing new publishes nothing
    if: ${{ !cancelled() && !failure() && (github.event_name != 'schedule' || needs.update.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # branch tip, including this run's data commit
          persist-credentials: false

      - name: Collect the site files
        run: |
          rsync -a --exclude .git --exclude .github --exclude .claude --exclude tools/.cache ./ "$RUNNER_TEMP/site/"
          # Versioned URLs for our own CSS/JS (?v=<commit>), so a normal reload picks up a new deploy
          # instead of a copy the browser kept (GitHub Pages lets browsers cache files for 10 minutes).
          v="$(git rev-parse --short HEAD)"
          find "$RUNNER_TEMP/site" -name '*.html' -exec sed -i -E "s#((src|href)=\"[./]*assets/(js|css)/[A-Za-z0-9_-]+\.(js|css))\"#\1?v=$v\"#g" {} +
          sed -i "s#from './orrery.js'#from './orrery.js?v=$v'#" "$RUNNER_TEMP/site/assets/js/observations.js"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - id: deployment
        uses: actions/deploy-pages@v4
